; polybar module for LLimit — merge into ~/.config/polybar/config.ini and add
; `llimit` to your bar's modules-left/center/right, e.g.:
;
;   modules-right = llimit cpu memory date
;
; polybar can't parse JSON itself, so the rendering lives in llimit.sh (needs jq):
; it maps the JSON `class` to a polybar foreground color and prints the text.
; polybar has no tooltip support for script modules — click opens the full
; human-readable status in a terminal instead (adjust to your terminal).

[module/llimit]
type = custom/script
exec = ~/.config/polybar/llimit.sh
interval = 300
click-left = xterm -e "sh -c 'llimit status; echo; echo press Enter; read _'"
