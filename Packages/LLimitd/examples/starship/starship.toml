[custom.llimit]
command = "llimit status --worst --format '{name} {remaining}'"
when = '[ -n "$(llimit status --worst --format x 2>/dev/null)" ]'
shell = ["sh"]
format = "[$output]($style) "
style = "bold yellow"

# To show it only on a low, missing, stale or failing Claude quota:
# when = "! llimit check anthropic --min 25 >/dev/null"
