# LLimit in the tmux status line: the account with the least quota left,
# colored by its class. tmux re-runs #() commands every status-interval
# seconds; `llimit status` reads only the snapshot, so polling is cheap.
#
# Put llimit-tmux.sh on PATH (or use its full path below), then source this
# file from ~/.tmux.conf.
set -g status-interval 60
set -g status-right-length 60
set -g status-right '#(llimit-tmux.sh) %H:%M '

# Plain text, no script needed:
# set -g status-right '#(llimit status --worst --format "{name} {remaining} {kind}") %H:%M '
