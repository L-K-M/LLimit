name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: LLimit.xcodeproj
  SCHEME: LLimitApp

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Run QuotaCore tests
        working-directory: Packages/QuotaCore
        run: swift test

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'   # pin so a runner-image bump can't change the toolchain

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath "$RUNNER_TEMP/LLimitBuild" \
            CODE_SIGNING_ALLOWED=NO \
            clean build | xcbeautify

      - name: Test primary limit colors
        run: scripts/test-limit-colors.sh --skip-build "$RUNNER_TEMP/LLimitBuild"

      - name: Test menu bar panel geometry
        run: scripts/test-panel-geometry.sh

      - name: Test Claude embedded terminal
        run: scripts/test-claude-profile.sh --skip-build "$RUNNER_TEMP/LLimitBuild"

      - name: Test QuotaCore package
        run: swift test --package-path Packages/QuotaCore

      - name: Upload build results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

  linux-test:
    name: Linux (SwiftPM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Swift 6.2.3
        # Direct tarball: swift-actions/setup-swift@v2 tops out at 6.2.1, and the
        # static Linux SDK used for releases must match the toolchain version.
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libcurl4-openssl-dev libedit2 libgcc-13-dev \
            libpython3-dev libstdc++-13-dev libxml2-dev libncurses-dev libz3-dev \
            pkg-config tzdata zlib1g-dev
          curl -sSfL https://download.swift.org/swift-6.2.3-release/ubuntu2404/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE-ubuntu24.04.tar.gz -o /tmp/swift.tar.gz
          sudo mkdir -p /opt/swift
          sudo tar xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> $GITHUB_PATH
          /opt/swift/usr/bin/swift --version
      - name: Test QuotaCore
        working-directory: Packages/QuotaCore
        run: swift test
      - name: Test LLimitd (llimit daemon + CLI)
        working-directory: Packages/LLimitd
        run: swift test

  linux-static:
    name: Linux (static .deb)
    # Mirrors the release-linux job in release.yml, which builds the shipped
    # .deb with the musl SDK: that SDK has no Glibc module, so a break there
    # would otherwise only surface when a tag is pushed.
    runs-on: ubuntu-24.04
    env:
      VERSION: "0.0.0~ci"
    steps:
      - uses: actions/checkout@v7

      - name: Test package version configuration
        run: python3 -m unittest discover -s scripts/tests -p test_llimit_package_version.py

      - name: Install Swift 6.2.3
        # Direct tarball: swift-actions/setup-swift@v2 tops out at 6.2.1, and the
        # static Linux SDK below must match the toolchain version exactly.
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libcurl4-openssl-dev libedit2 libgcc-13-dev \
            libpython3-dev libstdc++-13-dev libxml2-dev libncurses-dev libz3-dev \
            pkg-config tzdata zlib1g-dev
          curl -sSfL https://download.swift.org/swift-6.2.3-release/ubuntu2404/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE-ubuntu24.04.tar.gz -o /tmp/swift.tar.gz
          sudo mkdir -p /opt/swift
          sudo tar xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> $GITHUB_PATH
          /opt/swift/usr/bin/swift --version

      - name: Install static Linux SDK
        # Fully static (musl) build: the .deb needs no Swift runtime on the target.
        # Checksum from https://www.swift.org/install/linux/tarball/ for the 6.2.3 static SDK.
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.2.3-release/static-sdk/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz \
            --checksum f30ec724d824ef43b5546e02ca06a8682dafab4b26a99fbb0e858c347e507a2c

      - name: Stamp llimit version
        run: python3 scripts/stamp-llimit-version.py "$VERSION"

      - name: Build static llimit binary
        run: swift build -c release --swift-sdk x86_64-swift-linux-musl --package-path Packages/LLimitd

      - name: Build .deb
        run: Packages/LLimitd/packaging/build-deb.sh "$VERSION"

      - name: Test the packaged binary
        run: |
          dpkg-deb -x "Packages/LLimitd/.build/llimit_${VERSION}_amd64.deb" "$RUNNER_TEMP/deb"
          binary="$RUNNER_TEMP/deb/usr/bin/llimit"
          # file prints "static-pie linked" instead when the binary is PIE.
          linkage="$(file -b "$binary")"
          echo "$linkage"
          case "$linkage" in
            *"statically linked"* | *"static-pie linked"*) ;;
            *) echo "::error::the packaged llimit is not statically linked"; exit 1 ;;
          esac
          python3 -I scripts/test-llimit-secret-input.py "$binary"

  tray-test:
    name: Linux (tray)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The menu model is pure Python with no GTK import, so these run without
      # a display, a session bus or a panel.
      - name: Test tray menu model
        run: python3 -m unittest discover -s Packages/LLimitd/tray/tests -v
      - name: Lint tray for syntax errors
        run: python3 -m compileall -q Packages/LLimitd/tray/llimit_tray.py
